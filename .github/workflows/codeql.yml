name: codeql

# Static security analysis of the JavaScript (sidecar, frontend, CLI) and of the workflows themselves.
# Free on a public repository; findings land in the Security tab, not in a failed check.
on:
  pull_request:
  push:
    branches: [feat/harness-backend]
  schedule:
    - cron: '23 4 * * 1'   # weekly, so new CodeQL queries reach code nobody touched
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
