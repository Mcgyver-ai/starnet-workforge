name: secret-history

on:
  pull_request:
  push:
    branches: [main, feat/harness-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          curl --fail --location --silent --show-error "$url" --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full reachable history
        # -v prints each finding (rule, file, commit, line) with the secret REDACTED so a red run
        # names what it found. Without it the log only says "leaks found: N" — the gate stayed red
        # for weeks (v0.10.11 → v0.10.13) because nobody could see what to classify.
        run: ./gitleaks git . --no-banner --redact -v
